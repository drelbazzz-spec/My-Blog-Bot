name: Tech Bot

#    on:
 #    workflow_dispatch:
#      schedule:
#       - cron: '0 9,15,20 * * *' # تشغيل تلقائي 3 مرات يومياً

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install groq
        pip install requests

    - name: Run script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # التعديل المهم هنا
        BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      run: python main.py
